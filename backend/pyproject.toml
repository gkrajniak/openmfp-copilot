[project]
name = "openmfp-copilot"
version = "0.1.0"
description = "AI copilot backend for OpenMFP and Platform Mesh libraries"
authors = [
    { name = "gkrajniak" }
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "httpx2>=2.16.2",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "voyageai>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.fastapi]
entrypoint = "openmfp_copilot.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "FAST", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.alembic]
script_location = "%(here)s/migrations"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
