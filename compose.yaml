services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg19
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: openmfp_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d openmfp_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
